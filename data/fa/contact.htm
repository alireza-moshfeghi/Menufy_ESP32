<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .contact-container {
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            transition: none !important;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 15px;
            padding: 8px;
            border-bottom-width: 1px;
            border-bottom-style: solid;
            direction: rtl;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-icon {
            font-size: 1.3em;
            margin-left: 3px;
            width: 30px;
            text-align: center;
        }

        .contact-text {
            font-size: 0.95em;
            text-align: right;
            word-wrap: break-word;
        }

        .contact-link {
            text-decoration: none;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
            border: none;
            cursor: pointer;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loading.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 20px 32px;
            border-radius: 12px;
            font-family: Tahoma, sans-serif;
            font-size: 18px;
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #666666;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .contact-container {
                padding: 20px;
                width: 95%;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 15px;
            }

            .contact-item {
                margin-bottom: 10px;
                padding: 5px;
            }

            .contact-text {
                font-size: 0.9em;
            }

            .contact-icon {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="loader-content">
            <div class="spinner"></div>
            <span>...در حال بارگزاری</span>
        </div>
    </div>
    <div class="contact-container">
        <h1 class="header-title">تماس با ما</h1>
        <div class="contact-item">
            <span class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" viewBox="0 0 384 512"><path fill="#fff" d="M0 188.6C0 84.4 86 0 192 0S384 84.4 384 188.6c0 119.3-120.2 262.3-170.4 316.8-11.8 12.8-31.5 12.8-43.3 0-50.2-54.5-170.4-197.5-170.4-316.8zM192 256a64 64 0 1 0 0-128 64 64 0 1 0 0 128z"/></svg>
            </span>
            <div class="contact-text" id="address" dir="rtl"></div>
        </div>
        <div class="contact-item">
            <span class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" viewBox="0 0 512 512"><path fill="#fff" d="M160.2 25C152.3 6.1 131.7-3.9 112.1 1.4l-5.5 1.5c-64.6 17.6-119.8 80.2-103.7 156.4 37.1 175 174.8 312.7 349.8 349.8 76.3 16.2 138.8-39.1 156.4-103.7l1.5-5.5c5.4-19.7-4.7-40.3-23.5-48.1l-97.3-40.5c-16.5-6.9-35.6-2.1-47 11.8l-38.6 47.2C233.9 335.4 177.3 277 144.8 205.3L189 169.3c13.9-11.3 18.6-30.4 11.8-47L160.2 25z"/></svg>
            </span>
            <div class="contact-text">
                <a href="tel:" id="phone" class="contact-link"></a>
            </div>
        </div>
        <div class="contact-item">
            <span class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" viewBox="0 0 512 512"><path fill="#fff" d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/></svg>
            </span>
            <div class="contact-text">
                <a href="mailto:" id="email" class="contact-link"></a>
            </div>
        </div>
        <div class="contact-item">
            <span class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" viewBox="0 0 448 512"><path fill="#fff" d="M194.4 211.7a53.3 53.3 0 1 0 59.2 88.6 53.3 53.3 0 1 0 -59.2-88.6zm142.3-68.4c-5.2-5.2-11.5-9.3-18.4-12-18.1-7.1-57.6-6.8-83.1-6.5-4.1 0-7.9 .1-11.2 .1s-7.2 0-11.4-.1c-25.5-.3-64.8-.7-82.9 6.5-6.9 2.7-13.1 6.8-18.4 12s-9.3 11.5-12 18.4c-7.1 18.1-6.7 57.7-6.5 83.2 0 4.1 .1 7.9 .1 11.1s0 7-.1 11.1c-.2 25.5-.6 65.1 6.5 83.2 2.7 6.9 6.8 13.1 12 18.4s11.5 9.3 18.4 12c18.1 7.1 57.6 6.8 83.1 6.5 4.1 0 7.9-.1 11.2-.1s7.2 0 11.4 .1c25.5 .3 64.8 .7 82.9-6.5 6.9-2.7 13.1-6.8 18.4-12s9.3-11.5 12-18.4c7.2-18 6.8-57.4 6.5-83 0-4.2-.1-8.1-.1-11.4s0-7.1 .1-11.4c.3-25.5 .7-64.9-6.5-83-2.7-6.9-6.8-13.1-12-18.4l0 .2zm-67.1 44.5c18.1 12.1 30.6 30.9 34.9 52.2s-.2 43.5-12.3 61.6c-6 9-13.7 16.6-22.6 22.6s-19 10.1-29.6 12.2c-21.3 4.2-43.5-.2-61.6-12.3s-30.6-30.9-34.9-52.2 .2-43.5 12.2-61.6 30.9-30.6 52.2-34.9 43.5 .2 61.6 12.2l.1 0zm29.2-1.3c-3.1-2.1-5.6-5.1-7.1-8.6s-1.8-7.3-1.1-11.1 2.6-7.1 5.2-9.8 6.1-4.5 9.8-5.2 7.6-.4 11.1 1.1 6.5 3.9 8.6 7 3.2 6.8 3.2 10.6c0 2.5-.5 5-1.4 7.3s-2.4 4.4-4.1 6.2-3.9 3.2-6.2 4.2-4.8 1.5-7.3 1.5c-3.8 0-7.5-1.1-10.6-3.2l-.1 0zM448 96c0-35.3-28.7-64-64-64L64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320zM357 389c-18.7 18.7-41.4 24.6-67 25.9-26.4 1.5-105.6 1.5-132 0-25.6-1.3-48.3-7.2-67-25.9s-24.6-41.4-25.8-67c-1.5-26.4-1.5-105.6 0-132 1.3-25.6 7.1-48.3 25.8-67s41.5-24.6 67-25.8c26.4-1.5 105.6-1.5 132 0 25.6 1.3 48.3 7.1 67 25.8s24.6 41.4 25.8 67c1.5 26.3 1.5 105.4 0 131.9-1.3 25.6-7.1 48.3-25.8 67l0 .1z"/></svg>
            </span>
            <div class="contact-text">
                <a href="https://instagram.com" id="instagram" target="_blank" class="contact-link"></a>
            </div>
        </div>
        <div class="contact-item">
            <span class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" viewBox="0 0 512 512"><path fill="#fff" d="M256 8a248 248 0 1 0 0 496 248 248 0 1 0 0-496zM371 176.7c-3.7 39.2-19.9 134.4-28.1 178.3-3.5 18.6-10.3 24.8-16.9 25.4-14.4 1.3-25.3-9.5-39.3-18.7-21.8-14.3-34.2-23.2-55.3-37.2-24.5-16.1-8.6-25 5.3-39.5 3.7-3.8 67.1-61.5 68.3-66.7 .2-.7 .3-3.1-1.2-4.4s-3.6-.8-5.1-.5c-2.2 .5-37.1 23.5-104.6 69.1-9.9 6.8-18.9 10.1-26.9 9.9-8.9-.2-25.9-5-38.6-9.1-15.5-5-27.9-7.7-26.8-16.3 .6-4.5 6.7-9 18.4-13.7 72.3-31.5 120.5-52.3 144.6-62.3 68.9-28.6 83.2-33.6 92.5-33.8 2.1 0 6.6 .5 9.6 2.9 2 1.7 3.2 4.1 3.5 6.7 .5 3.2 .6 6.5 .4 9.8z"/></svg>
            </span>
            <div class="contact-text">
                <a href="https://t.me" id="telegram" target="_blank" class="contact-link"></a>
            </div>
        </div>
        <a href="/fa/" class="back-btn action-btn">بازگشت به منو</a>
    </div>
    <script>
        fetch('/fa/contact/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.name) {
                    document.title = data.name + " | تماس با ما";
                }
                if (data.address) {
                    document.querySelector("#address").textContent = toPersianDigits(data.address);
                }
                if (data.phone) {
                    document.querySelector("#phone").textContent = toPersianDigits(data.phone);
                    document.querySelector("#phone").setAttribute("href", "tel:" + data.phone.replace("-", "").replace("_", ""));
                }
                if (data.email) {
                    document.querySelector("#email").textContent = data.email;
                    document.querySelector("#email").setAttribute("href", "mailto:" + data.email);
                }
                if (data.instagram) {
                    document.querySelector("#instagram").textContent = data.instagram;
                    document.querySelector("#instagram").setAttribute("href", data.instagram);
                }
                if (data.telegram) {
                    document.querySelector("#telegram").textContent = data.telegram;
                    document.querySelector("#telegram").setAttribute("href", data.telegram);
                }
                if (data.bgcolor) {
                    document.body.style.backgroundColor = data.bgcolor;
                    let bodyColor = window.getComputedStyle(document.body).backgroundColor;
                    let rgb = bodyColor.match(/\d+/g).map(Number);
                    let lighterR = Math.min(255, rgb[0] + 30);
                    let lighterG = Math.min(255, rgb[1] + 30);
                    let lighterB = Math.min(255, rgb[2] + 30);
                    let newColor = `rgb(${lighterR}, ${lighterG}, ${lighterB})`;
                    let container = document.querySelector('.contact-container');
                    container.style.backgroundColor = newColor;
                    lighterR = Math.min(255, rgb[0] + 60);
                    lighterG = Math.min(255, rgb[1] + 60);
                    lighterB = Math.min(255, rgb[2] + 60);
                    newColor = `rgb(${lighterR}, ${lighterG}, ${lighterB})`;
                    document.querySelectorAll('.contact-item').forEach(item => {
                        item.style.borderBottomColor = newColor;
                    });
                }
                if (data.fgcolor) {
                    document.body.style.color = data.fgcolor;
                    document.querySelector('.back-btn').style.color = data.fgcolor;
                    document.querySelectorAll('.contact-text').forEach(text => {
                        text.style.color = data.fgcolor;
                    });
                    document.querySelectorAll('.contact-link').forEach(item => {
                        item.style.color = data.fgcolor;
                    });
                }
                if (data.navcolor) {
                    document.querySelector('.back-btn').style.backgroundColor = data.navcolor;
                    let meta = document.createElement('meta');
                    meta.name = "theme-color";
                    meta.content = data.navcolor;
                    document.head.appendChild(meta);
                }
                if (data.catcolor) {
                    document.querySelector('.header-title').style.color = data.catcolor;
                }
                setTimeout(hideLoading, 500);
            })
            .catch(error => {
                console.error('خطا در دریافت اطلاعات:', error);
            });
        function hideLoading() {
            document.getElementById('loading').classList.add('fade-out');
        }
        function toPersianDigits(str) {
            const id = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return str.toString().replace(/[0-9]/g, function (w) {
                return id[+w];
            });
        }
    </script>
</body>

</html>
