<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            width: 100%;
        }

        .page-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 auto 15px auto;
        }

        h1 {
            font-size: 1.5em;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
        }

        .search-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
            margin: 0 auto 15px auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            direction: ltr;
        }

        .orders-container {
            width: 95%;
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 20px;
            transition: none !important;
            margin: 0 auto;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px;
            border-bottom: 1px solid;
            direction: ltr;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-info {
            flex: 1;
            min-width: 200px;
        }

        .customer-name {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .customer-detail {
            font-size: 0.85em;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .products-list {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.05);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed;
            flex-wrap: wrap;
            gap: 5px;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-name {
            font-weight: bold;
            flex: 1;
            min-width: 120px;
        }

        .product-details {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .total-price {
            font-weight: bold;
            color: #fff;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            margin-left: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 5px;
            right: 15px;
            line-height: 1;
        }

        .modal-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            margin-top: 5px;
            color: #333;
        }

        .modal-message {
            margin-bottom: 25px;
            font-size: 1em;
            line-height: 1.6;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1em;
            min-width: 120px;
        }

        .form-group {
            margin-bottom: 0;
            text-align: left;
        }

        .form-group label {
            display: block;
            text-align: left;
            color: #333;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
            direction: ltr;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #888;
        }

        .products-input-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .product-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .product-row select,
        .product-row input {
            padding: 8px;
            margin: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .product-row select {
            flex: 2;
            min-width: 120px;
        }

        .product-row input[type="number"] {
            flex: 1;
            min-width: 60px;
        }

        .remove-product-btn {
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .add-product-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .total-display {
            font-size: 1.1em;
            font-weight: bold;
            text-align: right;
            padding: 10px;
            background: #4caf50;
            border-radius: 5px;
            margin-top: 10px;
        }

        .customer-info-display {
            text-align: left;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .customer-info-display .info-row {
            margin-bottom: 10px;
        }

        .customer-info-display .info-label {
            font-weight: bold;
            color: #555;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loading.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 20px 32px;
            border-radius: 12px;
            font-family: Tahoma, sans-serif;
            font-size: 18px;
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #666666;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
                align-items: center;
            }

            .page-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                width: 100%;
            }

            .header-buttons {
                width: 100%;
                justify-content: center;
            }

            .orders-container {
                padding: 15px;
                width: 100%;
                margin: 0 auto;
            }

            .order-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .order-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }

            .modal-content {
                padding: 20px 15px;
            }

            .search-container {
                width: 100%;
            }

            .product-row {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="loader-content">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <div class="page-header">
        <h1 class="header-title">Order Management</h1>
        <div class="header-buttons">
            <button class="add-btn action-btn" onclick="openAddCustomerModal()">👤 Add Customer</button>
            <button class="add-btn action-btn" onclick="openAddOrderModal()">➕ New Order</button>
        </div>
    </div>
    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search order..."
            oninput="searchOrders()">
    </div>
    <div class="orders-container" id="ordersList">
    </div>
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDeleteModal()">&times;</span>
            <h2 class="modal-title">Delete Order</h2>
            <p class="modal-message">Are you sure you want to delete this order?</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm-delete-btn" onclick="confirmDelete()">Yes</button>
                <button class="modal-btn cancel-btn" onclick="closeDeleteModal()">No</button>
            </div>
        </div>
    </div>
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
            <h2 class="modal-title">Edit Order</h2>
            <form onsubmit="saveEdit(event)">
                <input type="hidden" id="editOrderId">
                <input type="hidden" id="editCustomerAddress">
                <input type="hidden" id="editTotalPrice">
                <div class="form-group">
                    <label>Select Customer:</label>
                    <select id="editCustomerSelect" required>
                        <option value="">-- Select --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Products:</label>
                    <div id="editProductsContainer" class="products-input-container">
                    </div>
                    <button type="button" class="add-product-btn" onclick="addEditProductRow()">➕ Add Product</button>
                </div>
                <div class="total-display" id="editTotalDisplay">Total: 0</div>
                <button type="submit" class="modal-btn save-btn">💾 Save</button>
                <button type="button" class="modal-btn cancel-btn" onclick="closeEditModal()">Cancel</button>
            </form>
        </div>
    </div>
    <div class="modal" id="addOrderModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddOrderModal()">&times;</span>
            <h2 class="modal-title">New Order</h2>
            <form onsubmit="saveNewOrder(event)">
                <input type="hidden" id="newTotalPrice">
                <div class="form-group">
                    <label>Select Customer:</label>
                    <select id="newCustomerSelect" required>
                        <option value="">-- Select --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Products:</label>
                    <div id="newProductsContainer" class="products-input-container">
                    </div>
                    <button type="button" class="add-product-btn" onclick="addNewProductRow()">➕ Add Product</button>
                </div>
                <div class="total-display" id="newTotalDisplay">Total: 0</div>
                <button type="submit" class="modal-btn save-btn">➕ Submit Order</button>
                <button type="button" class="modal-btn cancel-btn" onclick="closeAddOrderModal()">Cancel</button>
            </form>
        </div>
    </div>
    <div class="modal" id="addCustomerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddCustomerModal()">&times;</span>
            <h2 class="modal-title">Add New Customer</h2>
            <form onsubmit="saveNewCustomer(event)">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="newFullname">
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="newPhone">
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" id="newAddress">
                </div>
                <button type="submit" class="modal-btn save-btn">➕ Add</button>
                <button type="button" class="modal-btn cancel-btn" onclick="closeAddCustomerModal()">Cancel</button>
            </form>
        </div>
    </div>
    <div class="modal" id="customerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCustomerModal()">&times;</span>
            <h2 class="modal-title">Customer Information</h2>
            <form onsubmit="saveCustomer(event)">
                <input type="hidden" id="customerOrderId">
                <input type="hidden" id="customerPhone">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="customerNameDisplay">
                    <label>Phone Number:</label>
                    <input type="text" id="customerPhoneDisplay">
                    <label>Address:</label>
                    <input type="text" id="customerAddress" placeholder="Enter customer address">
                </div>
                <button type="submit" class="modal-btn save-btn">💾 Save</button>
                <button type="button" class="modal-btn cancel-btn" onclick="closeCustomerModal()">Cancel</button>
            </form>
        </div>
    </div>
    <script>
        var account = "";
        var cookie = document.cookie;
        var token = cookie.split('; ').find(row => row.startsWith('token='));
        if (token) {
            token = token.split('=')[1];
            var formData = new URLSearchParams();
            formData.append('token', token);
            fetch('/en/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status == "admin") {
                        account = "admin";
                    }
                    else if (data.status == "user") {
                        account = "user";
                    }
                    else if (data.status == "invalid") {
                        window.location.href = '/en/login/';
                    }
                });
        }
        else {
            window.location.href = '/en/login/';
        }
        let deleteOrderId = null;
        let allOrders = [];
        let allCustomers = [];
        let allProducts = [];
        function getToken() {
            var cookie = document.cookie;
            var token = cookie.split('; ').find(row => row.startsWith('token='));
            if (token) {
                return token.split('=')[1];
            }
            return null;
        }
        var token = getToken();
        if (token) {
            var formData = new URLSearchParams();
            formData.append('token', token);
            fetch('/en/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    window.buttonColors = data;
                    if (data.name) {
                        document.title = data.name + " | Orders";
                    }
                    if (data.bgcolor) {
                        document.body.style.backgroundColor = data.bgcolor;
                        let bodyColor = window.getComputedStyle(document.body).backgroundColor;
                        let rgb = bodyColor.match(/\d+/g).map(Number);
                        let lighterR = Math.min(255, rgb[0] + 30);
                        let lighterG = Math.min(255, rgb[1] + 30);
                        let lighterB = Math.min(255, rgb[2] + 30);
                        let newColor = `rgb(${lighterR}, ${lighterG}, ${lighterB})`;
                        document.querySelector('.orders-container').style.backgroundColor = newColor;
                        document.querySelector('.search-input').style.backgroundColor = newColor;
                    }
                    if (data.fgcolor) {
                        document.body.style.color = data.fgcolor;
                        document.querySelector('.search-input').style.color = data.fgcolor;
                        document.querySelectorAll('.add-product-btn').forEach(btn => {
                            btn.style.color = data.fgcolor;
                        });
                        document.querySelectorAll('.confirm-delete-btn').forEach(btn => {
                            btn.style.color = data.fgcolor;
                        });
                        document.querySelectorAll('.add-btn').forEach(btn => {
                            btn.style.color = data.fgcolor;
                        });
                        document.querySelectorAll('.save-btn').forEach(btn => {
                            btn.style.color = data.fgcolor;
                        });
                        document.querySelectorAll('.cancel-btn').forEach(btn => {
                            btn.style.color = data.fgcolor;
                        });
                    }
                    if (data.navcolor) {
                        document.querySelectorAll('.add-product-btn').forEach(btn => {
                            btn.style.backgroundColor = data.navcolor;
                        });
                        document.querySelectorAll('.confirm-delete-btn').forEach(btn => {
                            btn.style.backgroundColor = data.navcolor;
                        });
                        document.querySelectorAll('.add-btn').forEach(btn => {
                            btn.style.backgroundColor = data.navcolor;
                        });
                        document.querySelectorAll('.save-btn').forEach(btn => {
                            btn.style.backgroundColor = data.navcolor;
                        });
                        document.querySelectorAll('.cancel-btn').forEach(btn => {
                            btn.style.backgroundColor = data.navcolor;
                        });
                        let meta = document.createElement('meta');
                        meta.name = "theme-color";
                        meta.content = data.navcolor;
                        document.head.appendChild(meta);
                    }
                    if (data.catcolor) {
                        document.querySelector('.header-title').style.color = data.catcolor;
                    }
                    if (data.products && Array.isArray(data.products)) {
                        allProducts = data.products.map(p => ({
                            id: p.id,
                            name: p.name,
                            price: p.price || 0
                        }));
                    }
                })
                .catch(error => {
                    console.log('Error loading products:', error);
                });
            fetch('/en/users/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.users && Array.isArray(data.users)) {
                        allCustomers = data.users.map((user, index) => ({
                            id: user.id || String(index + 1),
                            name: user.name || '',
                            phone: user.phone || '',
                            address: user.address || ''
                        }));
                    }
                    return fetch('/en/orders/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: formData.toString()
                    });
                })
                .then(response => response.json())
                .then(data => {
                    if (data.orders && Array.isArray(data.orders)) {
                        allOrders = data.orders.map((order, index) => ({
                            id: order.id || String(index + 1),
                            customerId: order.customer_id || order.customerId,
                            customerName: order.customer_name || order.customerName || '',
                            customerPhone: order.customer_phone || order.customerPhone || '',
                            customerAddress: order.customer_address || order.customerAddress || '',
                            products: order.products || [],
                            totalPrice: order.total_price || order.totalPrice || 0
                        }));
                        renderOrders(allOrders);
                    }
                    setTimeout(hideLoading, 500);
                })
                .catch(error => {

                });
        }
        function hideLoading() {
            document.getElementById('loading').classList.add('fade-out');
        }
        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            container.innerHTML = '';
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 20px;">No orders found.</p>';
                return;
            }
            orders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-item';
                let productsHtml = '';
                order.products.forEach(product => {
                    const productTotal = (product.quantity || 0) * (product.unit_price || product.price || 0);
                    productsHtml += `
                        <div class="product-item">
                            <span class="product-name">${escapeHtml(product.name || product.product_name || '')}</span>
                            <span class="product-details">
                                Qty: ${product.quantity} × Unit Price: ${formatPrice(product.unit_price || product.price || 0)}
                            </span>
                            <span class="product-details">= ${formatPrice(productTotal)}</span>
                        </div>
                    `;
                });
                if (account == "admin") {
                    div.innerHTML = `
                    <div class="order-info">
                        <div class="customer-name">👤 ${escapeHtml(order.customerName)}</div>
                        <div class="customer-detail">📞 ${order.customerPhone}</div>
                        <div class="products-list">
                            ${productsHtml}
                            <div class="total-price">Total: ${formatPrice(order.totalPrice)}</div>
                        </div>
                    </div>
                    <div class="order-actions">
                        <button class="action-btn edit-btn" onclick="openEditModal('${order.id}', '${escapeHtml(order.customerAddress || '')}')">✏️ Edit</button>
                        <button class="action-btn delete-btn" onclick="openDeleteModal('${order.id}')">🗑️ Delete</button>
                        <button class="action-btn customer-btn" onclick="openCustomerModal('${order.id}', '${escapeHtml(order.customerName)}', '${order.customerPhone}', '${escapeHtml(order.customerAddress || '')}')">➕ Add</button>
                    </div>
                    `;
                }
                else if (account == "user") {
                    div.innerHTML = `
                    <div class="order-info">
                        <div class="customer-name">👤 ${escapeHtml(order.customerName)}</div>
                        <div class="customer-detail">📞 ${order.customerPhone}</div>
                        <div class="products-list">
                            ${productsHtml}
                            <div class="total-price">Total: ${formatPrice(order.totalPrice)}</div>
                        </div>
                    </div>
                    <div class="order-actions">
                        <button class="action-btn customer-btn" onclick="openCustomerModal('${order.id}', '${escapeHtml(order.customerName)}', '${order.customerPhone}', '${escapeHtml(order.customerAddress || '')}')">➕ Add</button>
                    </div>
                    `;
                }
                container.appendChild(div);
            });
            applyButtonColors();
        }
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        function formatPrice(price) {
            return price.toLocaleString('en-US');
        }
        function applyButtonColors() {
            if (window.buttonColors) {
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.style.backgroundColor = window.buttonColors.navcolor;
                    btn.style.color = '#fff';
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.style.backgroundColor = window.buttonColors.navcolor;
                    btn.style.color = '#fff';
                });
                document.querySelectorAll('.customer-btn').forEach(btn => {
                    btn.style.backgroundColor = window.buttonColors.navcolor;
                    btn.style.color = '#fff';
                });
            }
        }
        function searchOrders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (searchTerm === '') {
                renderOrders(allOrders);
                return;
            }
            const filtered = allOrders.filter(order => {
                const name = order.customerName.toLowerCase();
                const phone = order.customerPhone.toLowerCase();
                return name.includes(searchTerm) || phone.includes(searchTerm);
            });
            renderOrders(filtered);
        }
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
        function openDeleteModal(id) {
            deleteOrderId = id;
            document.getElementById('deleteModal').classList.add('active');
        }
        function closeDeleteModal() {
            deleteOrderId = null;
            document.getElementById('deleteModal').classList.remove('active');
        }
        function confirmDelete() {
            if (deleteOrderId) {
                var token = getToken();
                var formData = new URLSearchParams();
                formData.append('token', token);
                formData.append('action', 'delete');
                formData.append('order_id', deleteOrderId);
                fetch('/en/orders/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status == "ok") {
                            allOrders = allOrders.filter(o => o.id != deleteOrderId);
                            searchOrders();
                            closeDeleteModal();
                        }
                    })
                    .catch(error => {
                        alert('Error deleting order');
                    });
            }
        }
        function openEditModal(orderId, customerAddress) {
            const order = allOrders.find(o => o.id == orderId);
            if (!order) return;
            document.getElementById('editOrderId').value = orderId;
            document.getElementById('editCustomerAddress').value = customerAddress;
            const customerSelect = document.getElementById('editCustomerSelect');
            customerSelect.innerHTML = '<option value="">-- Select --</option>';
            allCustomers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.phone;
                option.textContent = `${customer.name}`;
                if (customer.phone === order.customerPhone) {
                    option.selected = true;
                }
                customerSelect.appendChild(option);
            });
            const productsContainer = document.getElementById('editProductsContainer');
            productsContainer.innerHTML = '';
            order.products.forEach(product => {
                addEditProductRow(product.product_id || product.id, product.quantity, product.unit_price || product.price);
            });
            updateEditTotal();
            document.getElementById('editModal').classList.add('active');
        }
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        function addEditProductRow(selectedId = '', quantity = 1, price = 0) {
            const container = document.getElementById('editProductsContainer');
            const row = document.createElement('div');
            row.className = 'product-row';
            let optionsHtml = '<option value="">-- Select Product --</option>';
            allProducts.forEach(product => {
                const selected = product.id == selectedId ? 'selected' : '';
                optionsHtml += `<option value="${product.id}" data-price="${product.price}" ${selected}>${product.name}</option>`;
            });
            row.innerHTML = `
                <select onchange="updateEditProductPrice(this)">${optionsHtml}</select>
                <input type="number" min="1" value="${quantity}" placeholder="Qty" oninput="updateEditTotal()">
                <input type="number" value="${price}" placeholder="Price" oninput="updateEditTotal()">
                <button type="button" class="remove-product-btn" onclick="this.parentElement.remove(); updateEditTotal()">✕</button>
            `;
            container.appendChild(row);
            if (selectedId) {
                const select = row.querySelector('select');
                const selectedOption = select.options[select.selectedIndex];
                if (selectedOption && selectedOption.dataset.price) {
                    row.querySelector('input[type="number"]:nth-of-type(2)').value = selectedOption.dataset.price;
                }
            }
        }
        function updateEditProductPrice(select) {
            const selectedOption = select.options[select.selectedIndex];
            const priceInput = select.parentElement.querySelector('input[type="number"]:nth-of-type(2)');
            if (selectedOption && selectedOption.dataset.price) {
                priceInput.value = selectedOption.dataset.price;
            }
            updateEditTotal();
        }
        function updateEditTotal() {
            const container = document.getElementById('editProductsContainer');
            const rows = container.querySelectorAll('.product-row');
            let total = 0;
            rows.forEach(row => {
                const quantity = parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value) || 0;
                const price = parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value) || 0;
                total += quantity * price;
            });
            document.getElementById('editTotalDisplay').textContent = `Total: ${formatPrice(total)}`;
            document.getElementById('editTotalPrice').value = total;
        }
        function saveEdit(event) {
            event.preventDefault();
            const orderId = document.getElementById('editOrderId').value;
            const customerAddress = document.getElementById('editCustomerAddress').value;
            const customerName = document.getElementById('editCustomerSelect').options[document.getElementById('editCustomerSelect').selectedIndex].text;
            const customerPhone = document.getElementById('editCustomerSelect').value;
            const totalPrice = document.getElementById('editTotalPrice').value;
            const productsContainer = document.getElementById('editProductsContainer');
            var token = getToken();
            var formData = new URLSearchParams();
            formData.append('token', token);
            formData.append('action', 'edit');
            formData.append('orderId', orderId);
            formData.append('customerName', customerName);
            formData.append('customerPhone', customerPhone);
            let index = 1;
            const rows = productsContainer.querySelectorAll('.product-row');
            const products = [];
            rows.forEach(row => {
                const select = row.querySelector('select');
                const selectedOption = select.options[select.selectedIndex];
                const productId = select.value;
                formData.append('id' + index, select.value);
                const productName = selectedOption.text;
                formData.append('name' + index, selectedOption.text);
                const quantity = parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value);
                formData.append('quantity' + index, parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value));
                const price = parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value);
                formData.append('price' + index, parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value));
                index++;
                if (productId && quantity && price) {
                    products.push({
                        id: productId,
                        name: productName,
                        quantity: quantity,
                        unit_price: price
                    });
                }
            });
            formData.append('totalPrice', totalPrice);
            fetch('/en/orders/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status == "customerName") {
                        alert("Please enter customer name.");
                    }
                    else if (data.status == "customerPhone") {
                        alert("Please enter customer phone number.");
                    }
                    else if (data.status == "totalPrice") {
                        alert("Please enter total price.");
                    }
                    else if (data.status == "ok") {
                        const index = allOrders.findIndex(o => o.id == orderId);
                        if (index !== -1) {
                            const customer = allCustomers.find(c => c.phone === customerPhone);
                            allOrders[index] = {
                                ...allOrders[index],
                                customerId: customer ? customer.id : '',
                                customerName: customer ? customer.name : '',
                                customerPhone: customerPhone,
                                customerAddress: data.address,
                                products: products,
                                totalPrice: products.reduce((sum, p) => sum + (p.quantity * p.unit_price), 0)
                            };
                        }
                        searchOrders();
                        closeEditModal();
                    }
                })
                .catch(error => {
                    alert('Error editing order');
                });
        }
        function openAddOrderModal() {
            const customerSelect = document.getElementById('newCustomerSelect');
            customerSelect.innerHTML = '<option value="">-- Select --</option>';
            allCustomers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.phone;
                option.textContent = `${customer.name}`;
                customerSelect.appendChild(option);
            });
            document.getElementById('newProductsContainer').innerHTML = '';
            addNewProductRow();
            document.getElementById('addOrderModal').classList.add('active');
        }
        function closeAddOrderModal() {
            document.getElementById('addOrderModal').classList.remove('active');
        }
        function addNewProductRow() {
            const container = document.getElementById('newProductsContainer');
            const row = document.createElement('div');
            row.className = 'product-row';
            let optionsHtml = '<option value="">-- Select Product --</option>';
            allProducts.forEach(product => {
                optionsHtml += `<option value="${product.id}" data-price="${product.price}">${product.name}</option>`;
            });
            row.innerHTML = `
                <select onchange="updateNewProductPrice(this)">${optionsHtml}</select>
                <input type="number" min="1" value="1" placeholder="Qty" oninput="updateNewTotal()">
                <input type="number" value="0" placeholder="Price" oninput="updateNewTotal()">
                <button type="button" class="remove-product-btn" onclick="this.parentElement.remove(); updateNewTotal()">✕</button>
            `;
            container.appendChild(row);
        }
        function updateNewProductPrice(select) {
            const selectedOption = select.options[select.selectedIndex];
            const priceInput = select.parentElement.querySelector('input[type="number"]:nth-of-type(2)');
            if (selectedOption && selectedOption.dataset.price) {
                priceInput.value = selectedOption.dataset.price;
            }
            updateNewTotal();
        }
        function updateNewTotal() {
            const container = document.getElementById('newProductsContainer');
            const rows = container.querySelectorAll('.product-row');
            let total = 0;
            rows.forEach(row => {
                const quantity = parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value) || 0;
                const price = parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value) || 0;
                total += quantity * price;
            });
            document.getElementById('newTotalDisplay').textContent = `Total: ${formatPrice(total)}`;
            document.getElementById('newTotalPrice').value = total;
        }
        function saveNewOrder(event) {
            event.preventDefault();
            const customerName = document.getElementById('newCustomerSelect').options[document.getElementById('newCustomerSelect').selectedIndex].text;
            const customerPhone = document.getElementById('newCustomerSelect').value;
            const totalPrice = document.getElementById('newTotalPrice').value;
            const productsContainer = document.getElementById('newProductsContainer');
            var token = getToken();
            var formData = new URLSearchParams();
            formData.append('token', token);
            formData.append('action', 'add');
            formData.append('customerName', customerName);
            formData.append('customerPhone', customerPhone);
            let index = 1;
            const rows = productsContainer.querySelectorAll('.product-row');
            const products = [];
            rows.forEach(row => {
                const select = row.querySelector('select');
                const selectedOption = select.options[select.selectedIndex];
                const productId = select.value;
                formData.append('id' + index, select.value);
                const productName = selectedOption.text;
                formData.append('name' + index, selectedOption.text);
                const quantity = parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value);
                formData.append('quantity' + index, parseInt(row.querySelector('input[type="number"]:nth-of-type(1)').value));
                const price = parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value);
                formData.append('price' + index, parseInt(row.querySelector('input[type="number"]:nth-of-type(2)').value));
                index++;
                if (productId && quantity && price) {
                    products.push({
                        id: productId,
                        name: productName,
                        quantity: quantity,
                        unit_price: price
                    });
                }
            });
            formData.append('totalPrice', totalPrice);
            fetch('/en/orders/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status == "customerName") {
                        alert("Please enter customer name.");
                    }
                    else if (data.status == "customerPhone") {
                        alert("Please enter customer phone number.");
                    }
                    else if (data.status == "totalPrice") {
                        alert("Please enter total price.");
                    }
                    else if (data.status == "ok") {
                        const customer = allCustomers.find(c => c.phone === customerPhone);
                        const newOrder = {
                            id: data.id,
                            customerId: customer ? customer.id : '',
                            customerName: customer ? customer.name : '',
                            customerPhone: customerPhone,
                            customerAddress: data.address,
                            products: products,
                            totalPrice: products.reduce((sum, p) => sum + (p.quantity * p.unit_price), 0)
                        };
                        allOrders.push(newOrder);
                        searchOrders();
                        closeAddOrderModal();
                    }
                })
                .catch(error => {
                    alert('Error placing order');
                });
        }
        function openAddCustomerModal() {
            document.getElementById('newFullname').value = '';
            document.getElementById('newPhone').value = '';
            document.getElementById('newAddress').value = '';
            document.getElementById('addCustomerModal').classList.add('active');
        }
        function closeAddCustomerModal() {
            document.getElementById('addCustomerModal').classList.remove('active');
        }
        function saveNewCustomer(event) {
            event.preventDefault();
            const newCustomer = {
                id: Date.now().toString(),
                name: document.getElementById('newFullname').value.trim(),
                phone: document.getElementById('newPhone').value,
                address: document.getElementById('newAddress').value
            };
            var token = getToken();
            var formData = new URLSearchParams();
            formData.append('token', token);
            formData.append('action', 'add');
            formData.append('name', newCustomer.name);
            formData.append('phone', newCustomer.phone);
            formData.append('address', newCustomer.address);
            fetch('/en/users/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status == "exists") {
                        alert("This phone number is already registered.");
                    }
                    else if (data.status == "name") {
                        alert("Please enter full name.")
                    }
                    else if (data.status == "phone") {
                        alert("Please enter phone number.")
                    }
                    else if (data.status == "ok") {
                        allCustomers.push(newCustomer);
                        document.getElementById('newFullname').value = '';
                        document.getElementById('newPhone').value = '';
                        document.getElementById('newAddress').value = '';
                        closeAddCustomerModal();
                    }
                })
                .catch(error => {
                    alert('Error adding customer');
                });
        }
        function openCustomerModal(orderId, name, phone, address) {
            document.getElementById('customerOrderId').value = orderId;
            document.getElementById('customerPhone').value = phone;
            document.getElementById('customerNameDisplay').value = name;
            document.getElementById('customerPhoneDisplay').value = phone;
            document.getElementById('customerAddress').value = address || '';
            document.getElementById('customerModal').classList.add('active');
        }
        function closeCustomerModal() {
            document.getElementById('customerModal').classList.remove('active');
        }
        function saveCustomer(event) {
            event.preventDefault();
            const orderId = document.getElementById('customerOrderId').value;
            const name = document.getElementById('customerNameDisplay').value;
            const phone = document.getElementById('customerPhoneDisplay').value;
            const address = document.getElementById('customerAddress').value.trim();
            var token = getToken();
            var formData = new URLSearchParams();
            formData.append('token', token);
            formData.append('action', 'add');
            formData.append('name', name);
            formData.append('phone', phone);
            formData.append('address', address);
            fetch('/en/users/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status == "exists") {
                        alert("This phone number is already registered.")
                    }
                    else if (data.status == "name") {
                        alert("Please enter full name.")
                    }
                    else if (data.status == "phone") {
                        alert("Please enter phone number.")
                    }
                    else if (data.status == "ok") {
                        const orderIndex = allOrders.findIndex(o => o.id == orderId);
                        if (orderIndex !== -1) {
                            allOrders[orderIndex].customerAddress = address;
                        }
                        const customerIndex = allCustomers.findIndex(c => c.phone === phone);
                        if (customerIndex !== -1) {
                            allCustomers[customerIndex].address = address;
                        }
                        searchOrders();
                        closeCustomerModal();
                    }
                })
                .catch(error => {
                    alert('Error saving customer information');
                });
        }
